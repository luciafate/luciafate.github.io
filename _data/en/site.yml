intro:
  heading: "What Is Imperial Astrology?"
  body:
    - "Imperial Astrology (Zi Wei Dou Shu) is a traditional Chinese system of chart interpretation. It draws together ideas from Indian astrology, Chinese celestial traditions, the I Ching, classical Chinese medicine, Qi Men Dun Jia, Ba Zi, and other divination traditions into a system centered on stars, twelve palaces, and timing cycles."
    - "Using your birth year, month, day, and hour, Imperial Astrology constructs a natal chart to explore your innate personality, natural potential, resources, and life challenges. As you grow, your experiences across different stages of life shape your outlook, personality, and ways of responding to the world."
    - "Its strength lies in examining how your evolving personal characteristics interact with your external environment across time and place. Reading the natal chart alongside ten-year, annual, and other timing charts allows us to explore how you bring your innate personality and accumulated experience to the opportunities, pressures, and limitations of each period. From these interactions, we can identify indications of possible events and how they may develop."
    - "These indications can inform predictions and practical decisions, helping you recognize opportunities, anticipate risks, and adjust your choices—to seek favorable outcomes and avoid potential harm in everyday life."

brand_pillars:
  heading: "Understand Yourself | See Your Choices | See the Trends"
  subheading: "From understanding the past and handling the present to preparing for the future."
  items:
    - title: "Understand Yourself"
      question: "How did I end up here?"
      body: "Rather than labeling you by a single star, we look at how thoughts become actions, how actions become habits, and how those habits keep appearing in your personality, relationships, and choices."
    - title: "See Your Choices"
      question: "What do I actually need to deal with right now?"
      body: "Going back to the conditions set out in the classical texts, and drawing on modern perspectives such as psychology, neurophysiology, and behavioral science, we untangle a knotted problem layer by layer to see what really shapes your choice."
    - title: "See the Trends"
      question: "What timing and risks lie ahead?"
      body: "Recognize possible timing, trends, and risks, so you know when to act and when to hold back. A chart shows signs, not verdicts; the choice is still yours."

reading:
