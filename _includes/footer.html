{% assign s = site.data['site-settings'] %}
<footer>
  <div class="wrap">
    <div class="foot-row">
      <a href="{{ '/' | relative_url }}" class="brand">
        <span class="brand-mark"><img src="{{ s.brand.logo | relative_url }}" alt="{{ s.brand.logo_alt }}"></span>
        <span class="brand-word">{{ s.brand.name }}<small>{{ s.brand.tagline }}</small></span>
      </a>
      <ul class="foot-links" aria-label="頁尾導覽">
        <li><a href="{{ '/' | relative_url }}">首頁</a></li>
        <li><a href="{{ '/blog.html' | relative_url }}">文章</a></li>
        <li><a href="{{ '/ebook.html' | relative_url }}">電子書</a></li>
        <li><a href="{{ '/courses.html' | relative_url }}">線上課程</a></li>
        <li><a href="{{ '/reading.html' | relative_url }}">論命</a></li>
        <li><a href="{{ s.social.threads }}" target="_blank" rel="noopener">Threads</a></li>
        <li><a href="{{ s.social.instagram }}" target="_blank" rel="noopener">Instagram</a></li>
        <li><a href="{{ s.line.add_friend_url }}" target="_blank" rel="noopener">LINE {{ s.line.official_id }}</a></li>
      </ul>
    </div>
    <p class="foot-copy">© 2026 {{ s.brand.name }}. #紫微斗數 #命理分析 #理性決策</p>
  </div>
</footer>
<script src="{{ '/assets/js/nav.js' | relative_url }}"></script>
